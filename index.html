<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://esm.sh;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob:;
      media-src 'self' blob:;
      connect-src 'self' https://esm.sh;
      worker-src 'self' blob: https://esm.sh;
      object-src 'none';
      base-uri 'self';
      frame-ancestors 'self';
    ">
    <title>mynarrator | AI Reading Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              serif: ['Merriweather', 'Georgia', 'serif'],
              display: ['Playfair Display', 'serif'],
              lora: ['Lora', 'Georgia', 'serif'],
              garamond: ['"EB Garamond"', 'Garamond', 'Georgia', 'serif'],
              literata: ['Literata', 'Georgia', 'serif'],
              jakarta: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
              atkinson: ['"Atkinson Hyperlegible"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            animation: {
              'slide-up': 'slide-up 0.5s ease-out',
              'fade-in': 'fade-in 0.3s ease-out',
              'fade-in-up': 'fade-in-up 0.5s ease-out',
              'bounce-subtle': 'bounce-subtle 2s infinite',
            },
            keyframes: {
              'slide-up': {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'fade-in-up': {
                 '0%': { opacity: '0', transform: 'translateY(10px)' },
                 '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'bounce-subtle': {
                '0%, 100%': { transform: 'translateY(-3%)' },
                '50%': { transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Playfair+Display:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif !important; }
      .font-serif { font-family: 'Merriweather', Georgia, serif !important; }
      .font-lora { font-family: 'Lora', Georgia, serif !important; }
      .font-garamond { font-family: 'EB Garamond', Garamond, Georgia, serif !important; }
      .font-literata { font-family: 'Literata', Georgia, serif !important; }
      .font-jakarta { font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif !important; }
      .font-atkinson { font-family: 'Atkinson Hyperlegible', -apple-system, sans-serif !important; }
      .font-mono { font-family: 'JetBrains Mono', monospace !important; }
      .font-display { font-family: 'Playfair Display', Georgia, serif !important; }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      .dark ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      
      .font-display {
        font-family: 'Playfair Display', serif;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.8",
    "react/": "https://esm.sh/react@19.2.8/",
    "react-dom/": "https://esm.sh/react-dom@19.2.8/",

    "mammoth": "https://esm.sh/mammoth@1.12.0"
  }
}
</script>

</head>

</html>
